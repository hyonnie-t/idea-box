<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a26" media="(prefers-color-scheme: dark)">
<title>클로드 쪽지함</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쪽지함">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/vendor/lucian-icons/refresh.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><span class="stamp-ico" aria-hidden="true">💌</span>클로드 쪽지함</h1>
    <p class="sub">클로드가 바쁘거나 한도에 걸렸을 때, 생각은 여기 먼저</p>
  </div>
  <div class="top-tools">
    <button type="button" class="icon-btn" id="refresh" aria-label="새로고침">
      <lucian-refresh state="idle" size="22"></lucian-refresh>
    </button>
    <button type="button" class="text-btn" id="signout" hidden>로그아웃</button>
  </div>
</header>

<main id="main">
  <p class="status" id="status" role="status" aria-live="polite">불러오는 중…</p>

  <section class="gate" id="gate" hidden aria-labelledby="gate-title">
    <h2 id="gate-title">효니만 쓰는 쪽지함이에요</h2>
    <p>클로드에게 남긴 생각은 로그인한 주인에게만 보여요.</p>
    <button type="button" class="primary" id="signin">구글로 로그인</button>
    <p class="gate-msg" id="gate-msg" role="status"></p>
  </section>

  <div id="content" hidden>
    <form class="compose" id="compose" autocomplete="off">
      <label class="vh" for="t">클로드에게 남길 생각</label>
      <textarea id="t" name="t" rows="4" placeholder="떠오른 생각을 그대로 적어 두세요. 다음 세션에서 클로드가 읽어요." required maxlength="4000"></textarea>
      <fieldset class="chips" id="tags">
        <legend>어느 일이에요?</legend><div class="chip-row"></div>
      </fieldset>
      <div class="compose-foot">
        <label class="hot"><input type="checkbox" id="hot"> <span>🔥 급해요</span></label>
        <span class="draft" id="draft" aria-live="polite"></span>
        <button type="submit" class="primary" id="send">쪽지 넣기</button>
      </div>
    </form>

    <div class="bar" role="group" aria-label="쪽지 거르기" id="filters"></div>

    <ol class="list" id="list"></ol>
    <p class="empty" id="empty" hidden></p>
  </div>
</main>

<dialog class="sheet" id="ask" aria-labelledby="ask-msg">
  <form method="dialog">
    <p id="ask-msg"></p>
    <div class="sheet-foot">
      <button type="button" class="text-btn" value="no" id="ask-no">그만두기</button>
      <button type="button" class="primary danger" value="yes" id="ask-yes">지우기</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="edit" aria-labelledby="edit-title">
  <form id="edit-form">
    <h2 id="edit-title">쪽지 고치기</h2>
    <label class="vh" for="edit-t">쪽지 글</label>
    <textarea id="edit-t" rows="6" required maxlength="4000"></textarea>
    <fieldset class="chips" id="edit-tags">
      <legend>어느 일이에요?</legend><div class="chip-row"></div>
    </fieldset>
    <label class="hot"><input type="checkbox" id="edit-hot"> <span>🔥 급해요</span></label>
    <div class="sheet-foot">
      <button type="button" class="text-btn" id="edit-cancel">그만두기</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
